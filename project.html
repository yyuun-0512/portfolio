<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project — Yoonjeong Cho</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/work.css">
  <link rel="stylesheet" href="css/project.css">
</head>
<body class="work-page project-page">
  <main class="viewport">
    <!-- 프로젝트 상세 (임시 틀 · Figma 상세 디자인이 나오면 교체) — 카드와 같은 x960 기준선 -->
    <section class="stage" id="stage" aria-labelledby="project-title">
      <div class="brand" id="brand">
        <a class="logo" id="logo" href="index.html" aria-label="yun jeong Cho — 메뉴 열기" aria-controls="nav" aria-expanded="false">
          <img class="icon" src="assets/logo-union.svg" width="106" height="61.249" alt="">
        </a>
        <nav class="nav" id="nav" aria-label="주요 메뉴">
          <a href="index.html">HOME</a>
          <a href="work.html#all" aria-current="page">WORK</a>
          <a href="#about">ABOUT</a>
        </nav>
      </div>

      <article class="project" id="project">
        <header class="project-label">
          <span class="no" id="project-no"></span>
          <h1 class="title mask"><span class="line" id="project-title"></span></h1>
        </header>
        <div class="project-visual"><div class="pic" id="project-pic" role="img"></div></div>
        <footer class="project-meta">
          <span class="no mask"><span class="line" id="project-year"></span></span>
          <span class="title mask"><span class="line" id="project-cat"></span></span>
          <a class="project-back mask" href="work.html#all"><span class="line">ALL WORK</span></a>
          <a class="project-next mask" id="project-next" data-cursor="detail-dark"><span class="line">NEXT</span></a>
        </footer>
      </article>
    </section>
  </main>

  <canvas class="cursor-trail" id="cursor-trail" aria-hidden="true"></canvas>
  <div class="cursor" id="cursor" aria-hidden="true"><span class="cursor-fill"></span><svg class="cursor-arrow" viewBox="0 0 20 20"><path d="M4.5 15.5 L15.5 4.5 M6.5 4.5 H15.5 V13.5" /></svg><span class="cursor-label">Detail</span></div>
  <svg class="cursor-line" id="cursor-line" viewBox="0 0 30 30" aria-hidden="true"><polygon points="29.5,0.5 29.5,29.5 0.5,29.5" /></svg>

  <script src="js/outline-data.js"></script>
  <script src="js/outline.js"></script>
  <script src="js/works-data.js"></script>
  <script src="js/project.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
